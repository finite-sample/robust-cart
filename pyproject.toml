[project]
name = "robust-cart"
version = "0.0.0"
description = "Experiments in growing a more accurate single CART-style tree"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "matplotlib==3.10.8",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
